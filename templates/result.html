<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการวิเคราะห์</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>ผลการวิเคราะห์</h1>

    <img src="{{ url_for('static', filename='uploads/' + filename) }}"
         style="width:100%; max-width:100%; height:auto; border-radius:12px; margin-bottom:20px;">

    <div class="result-box">
        <p><strong>ประเภทผื่น:</strong> {{ disease }}</p>
        <p><strong>ความมั่นใจ:</strong> {{ confidence }}%</p>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="--progress: {{ confidence }}%;"></div>
            </div>
        </div>

        <p><strong>คำแนะนำ:</strong> {{ advice }}</p>
    </div>

    <a href="/">
        <button>🔄 วิเคราะห์รูปอื่น</button>
    </a>
</div>

</body>
</html>
